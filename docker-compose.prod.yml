version: "3.9"

services:
  nginx:
    build:
      context: docker/nginx
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
      grafana:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: prod
    environment:
      ENV: prod
      FRONTEND_ORIGIN: https://${DOMAIN}
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: prod
    environment:
      NUXT_PUBLIC_API_BASE: https://${DOMAIN}
    depends_on:
      - backend
    expose:
      - "3000"

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grafana_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grafana_admin}
      POSTGRES_DB: ${POSTGRES_DB:-grafana_admin}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.1.0
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Editor
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_USER: ${POSTGRES_USER:-grafana_admin}
      GF_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-grafana_admin}
      GF_DATABASE_NAME: ${POSTGRES_DB:-grafana_admin}
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    depends_on:
      prometheus:
        condition: service_started
      postgres:
        condition: service_healthy

  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    environment:
      DOMAIN: ${DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    depends_on:
      nginx:
        condition: service_started
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do if [ ! -f /etc/letsencrypt/live/${DOMAIN}/fullchain.pem ]; then certbot certonly --webroot -w /var/www/certbot --email ${LETSENCRYPT_EMAIL} --agree-tos --no-eff-email --non-interactive -d ${DOMAIN}; fi; certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $!; done"

volumes:
  letsencrypt:
  certbot-webroot:
  postgres-data:
