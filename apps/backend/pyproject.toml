[project]
name = "tictactoe-backend"
version = "0.1.0"
description = "FastAPI backend for TicTacToe Telegram Mini App"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Codex" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "prometheus-client>=0.20.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.2",
    "redis>=5.0.4",
    "structlog>=24.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "anyio>=4.3.0",
    "httpx>=0.27.2",
    "hypothesis>=6.103.0",
    "coverage>=7.5.0",
    "mypy>=1.11.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --maxfail=1 --disable-warnings"

[tool.coverage.run]
source = ["tictactoe"]
branch = true

[tool.coverage.report]
omit = ["tests/*"]
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
plugins = []
ignore_missing_imports = true
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src/tictactoe"]
